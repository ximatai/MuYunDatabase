name: Release to Maven Central

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test release tooling
        run: node --test scripts/*.test.mjs

      - name: Verify release tag
        run: ./gradlew verifyReleaseTagVersion

      - name: Verify release credentials
        env:
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
          SIGNING_SECRET_KEY_BASE64: ${{ secrets.SIGNING_SECRET_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew verifyReleaseCredentials

      - name: Clean release workspace
        run: ./gradlew clean

      - name: Verify unsigned publication
        run: ./gradlew reportMavenPublication verifyPublishedConsumers

      - name: Test
        run: ./gradlew test

      - name: Publish to Maven Central
        env:
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
          SIGNING_SECRET_KEY_BASE64: ${{ secrets.SIGNING_SECRET_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishReleaseToSonatype -Pmuyun.mavenCentralRelease=true

      - name: Record publication usage and deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-publication-${{ github.ref_name }}
          path: |
            build/maven-central/report.json
            build/sonayUploader/uploaderId
          if-no-files-found: ignore
